<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather, in many designs</title>
<style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}html,body{margin:0}body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wth-pill{position:fixed;right:12px;bottom:12px;z-index:50;background:rgba(255,255,255,.92);color:#111;border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:6px 14px;font-size:13px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.wth-pill:hover{background:#fff}
@media (prefers-color-scheme:dark){.wth-pill{background:rgba(30,36,45,.92);color:#e8ecf2;border-color:rgba(255,255,255,.14)}.wth-pill:hover{background:#232b36}}
.wth-msg{padding:60px 20px;text-align:center;color:#6b7280}
body{background:#f6f6f8;color:#1d1d1f}
header{max-width:1500px;margin:0 auto;padding:24px 24px 8px}
h1{font-size:24px;margin:0 0 4px}header p{margin:0 0 12px;color:#6e6e73}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.bar button{border:1px solid #e3e3e6;background:#fff;border-radius:999px;padding:3px 12px;cursor:pointer;font:inherit;font-size:12.5px}
.bar button.on{background:#0a66e6;color:#fff;border-color:#0a66e6}
.grid{max-width:1500px;margin:0 auto;padding:12px 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{display:block;color:inherit;text-decoration:none;background:#fff;border:1px solid #e3e3e6;border-radius:12px;padding:10px;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#0a66e6;box-shadow:0 0 0 3px rgba(10,102,230,.1)}
.card h2{font-size:14px;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}.card h2 span{font-weight:400;color:#6e6e73;font-size:12px}
.card p{margin:4px 0 0;font-size:12px;color:#6e6e73}
.thumb{width:100%;aspect-ratio:560/700;overflow:hidden;border-radius:8px;border:1px solid #eee;position:relative;margin-top:6px;pointer-events:none}
.thumb>div{position:absolute;left:0;top:0;width:560px;height:700px;overflow:hidden;transform-origin:0 0}
#full{display:none}
.top{position:fixed;left:12px;top:12px;z-index:50;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:5px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.15);color:#111}
.top a{color:#0a66e6;text-decoration:none}
#fstage{max-width:560px;margin:0 auto;min-height:100vh;padding-top:44px}
</style><style id="vcss"></style></head>
<body>
<div id="list"><header><h1>Weather, in many designs</h1><p>Every design below runs on live data for your location. Click one to open it full size; the address of that page is its own bookmark. <a href="index.html">Back to the simple page</a>.</p><div class="bar" id="bar"></div></header><div class="grid" id="grid"><div class="wth-msg">Loading weather…</div></div></div>
<div id="full"><div class="top"><a href="#">← All designs</a> · <a href="index.html">Simple page</a> · <b id="fname"></b></div><div id="fstage"></div></div>
<script>
// Shared sample data for every design variation. Pune, Friday ~8:30 PM local.
window.V = window.V || [];
window.W = {
  place: "Pune, India",
  localTime: "8:30 PM",
  date: "Friday, 27 November",
  cityName: "Pune",
  weekdayLong: "Friday", weekdayShort: "Fri", dayNum: 27, monthShort: "Nov", monthLong: "November", year: 2026,
  dateShort: "27 Nov",
  hour24: 20, minute: 30,           // local time at the place, for placing sun/moon, clocks
  isNight: true,                    // true when current local time is before sunrise or after sunset
  now: { tempC: 27, icon: "⛅", desc: "Partly cloudy", feelsC: 29, code: 2 },
  // next 24h in 2-hour slots, starting now. prob = chance of rain %, mm = rainfall in slot
  rain24: [
    { hour: 20, prob: 10, mm: 0.0 }, { hour: 22, prob: 20, mm: 0.1 }, { hour: 0, prob: 35, mm: 0.4 },
    { hour: 2, prob: 55, mm: 1.2 }, { hour: 4, prob: 80, mm: 2.6 }, { hour: 6, prob: 90, mm: 3.1 },
    { hour: 8, prob: 70, mm: 1.5 }, { hour: 10, prob: 40, mm: 0.5 }, { hour: 12, prob: 20, mm: 0.1 },
    { hour: 14, prob: 10, mm: 0.0 }, { hour: 16, prob: 5, mm: 0.0 }, { hour: 18, prob: 5, mm: 0.0 }
  ],
  rainSummary: "Rain from about 2 AM, heaviest around 6 AM, 9.4 mm total.",
  // hourly temperature for the next 24h (index 0 = now, 8 PM)
  hourlyTempC: [27,26,26,25,25,24,24,23,23,23,23,24,25,27,29,30,31,31,30,29,28,27,26,26],
  days: [
    { name: "Today", nameLong: "Today", dateNum: 27, monthShort: "Nov", icon: "⛅", desc: "Partly cloudy", lo: 22, hi: 31, pop: 20, mm: 0.1 },
    { name: "Sat", nameLong: "Saturday", dateNum: 28, monthShort: "Nov",   icon: "🌧️", desc: "Rain",          lo: 21, hi: 26, pop: 85, mm: 11.4 },
    { name: "Sun", nameLong: "Sunday", dateNum: 29, monthShort: "Nov",   icon: "🌦️", desc: "Showers",       lo: 21, hi: 27, pop: 60, mm: 4.2 },
    { name: "Mon", nameLong: "Monday", dateNum: 30, monthShort: "Nov",   icon: "⛅", desc: "Partly cloudy", lo: 21, hi: 28, pop: 30, mm: 0.8 },
    { name: "Tue", nameLong: "Tuesday", dateNum: 1, monthShort: "Dec",   icon: "☀️", desc: "Sunny",         lo: 21, hi: 30, pop: 5,  mm: 0.0 },
    { name: "Wed", nameLong: "Wednesday", dateNum: 2, monthShort: "Dec",   icon: "☀️", desc: "Sunny",         lo: 22, hi: 31, pop: 0,  mm: 0.0 },
    { name: "Thu", nameLong: "Thursday", dateNum: 3, monthShort: "Dec",   icon: "🌤️", desc: "Mostly sunny",  lo: 22, hi: 32, pop: 5,  mm: 0.0 }
  ],
  details: {
    humidity: 62, windKmh: 11, windDir: "NW", gustKmh: 24, uv: 7, cloud: 40,
    sunrise: "6:12 AM", sunset: "6:04 PM", sunriseMin: 372, sunsetMin: 1084, // minutes after local midnight
     visibilityKm: 10, pressureHpa: 1012, dewC: 18
  }
};

try{// Family: data-viz as the hero. Variants 01-10.
(function () {
  const FAM = "data-viz as the hero";
  const f = n => (+n).toFixed(1);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // temperature -> colour, scaled to the data's own min/max (set per render by setup)
  let LO = 20, HI = 32, H0 = 20;
  const setup = W => {
    const v = [...(W.hourlyTempC || []), ...(W.days || []).flatMap(d => [d.lo, d.hi]), W.now && W.now.tempC].filter(Number.isFinite);
    let a = v.length ? Math.min(...v) : 20, b = v.length ? Math.max(...v) : 32;
    if (b - a < 6) { const m = (a + b) / 2; a = m - 3; b = m + 3; }
    LO = a; HI = b; H0 = Number.isFinite(W.hour24) ? W.hour24 : 20;
  };
  const tc = (t, s = 70, l = 55) => `hsl(${Math.round(220 - clamp((t - LO) / (HI - LO || 1), 0, 1) * 205)},${s}%,${l}%)`;
  const maxMm = W => Math.max(3.1, ...W.rain24.map(r => +r.mm || 0));
  const pc = v => clamp(+v || 0, 0, 100);
  const hr = h => (h === 0 ? "12 AM" : h === 12 ? "12 PM" : h < 12 ? h + " AM" : h - 12 + " PM");
  const hrs = h => (h === 0 ? "12a" : h === 12 ? "12p" : h < 12 ? h + "a" : h - 12 + "p");
  const hourOf = i => (H0 + i) % 24; // hourlyTempC index -> clock hour
  const sun = W => { const d = W.details || {}; return Number.isFinite(d.sunriseMin) && Number.isFinite(d.sunsetMin) ? { sr: d.sunriseMin / 60, ss: d.sunsetMin / 60 } : null; };
  const WRAP = "overflow-wrap:anywhere;min-width:0";
  const smooth = p => {
    let d = `M${f(p[0][0])},${f(p[0][1])}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
    }
    return d;
  };
  const det = d => [
    ["Humidity", d.humidity + "%"], ["Wind", `${d.windKmh} km/h ${d.windDir}`], ["UV index", d.uv],
    ["Cloud cover", d.cloud + "%"], ["Sunrise", d.sunrise], ["Sunset", d.sunset]
  ];
  const RM = id => `@media (prefers-reduced-motion: reduce){.d${id} *{animation:none !important}}`;

  /* ---------------- 01 24h dial ---------------- */
  V.push({
    id: "01", name: "24-hour Dial", family: FAM, level: "rich",
    blurb: "A clock face of the next day: the outer ring is hourly temperature coloured by heat, spokes pointing inward are rain chance, a gold arc marks daylight and the hand is 'now'. Inspired by the Weather Radials posters and radial temperature charts.",
    pro: "One glance answers 'when tonight does it rain and how cold does it get'.",
    con: "Hand-built SVG maths; clock metaphor takes a second to learn.",
    css: `.d01{background:#f7f3ea;color:#2a2620;font:13px/1.35 "Avenir Next","Segoe UI",sans-serif;padding:18px 20px;box-sizing:border-box;width:100%}
.d01 .hd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.d01 .pl{font-size:20px;font-weight:700;overflow-wrap:anywhere;min-width:0}.d01 .sub{color:#7a7062}
.d01 .mid{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:6px 0 4px}
.d01 svg.dial{width:310px;max-width:100%;height:auto;flex:none}
.d01 .side{flex:1;min-width:160px}
.d01 .lg{font-size:11px;color:#7a7062;margin:6px 0 10px}
.d01 .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.d01 .rs{background:#fff;border-left:3px solid #3b6fd6;padding:7px 9px;font-size:12px;margin-bottom:10px}
.d01 dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12px}.d01 dt{color:#7a7062}.d01 dd{margin:0;font-weight:600}
.d01 .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center;font-size:11px}
.d01 .wk div{background:#fff;border-radius:8px;padding:6px 2px}
.d01 .wk b{display:block;font-size:12px}.d01 .wk .ic{font-size:18px;display:block}.d01 .wk .ds{color:#7a7062;display:block;min-height:28px}
.d01 .wk .p{color:#3b6fd6;font-weight:600}
.d01 .hand{transform-origin:170px 170px;animation:d01-sweep 1.4s cubic-bezier(.2,.8,.2,1)}
.d01 .rb{transform-origin:170px 170px;animation:d01-in 1s ease-out both}
@keyframes d01-sweep{from{transform:rotate(-300deg)}to{transform:rotate(0)}}
@keyframes d01-in{from{opacity:0}to{opacity:1}}
${RM("01")}`,
    render: W => {
      setup(W);
      const c = 170, pt = (r, a) => [c + r * Math.sin(a * Math.PI / 180), c - r * Math.cos(a * Math.PI / 180)];
      const seg = (r0, r1, a0, a1) => { const A = pt(r1, a0), B = pt(r1, a1), C = pt(r0, a1), D = pt(r0, a0), lg = a1 - a0 > 180 ? 1 : 0; return `M${f(A[0])},${f(A[1])}A${r1},${r1} 0 ${lg} 1 ${f(B[0])},${f(B[1])}L${f(C[0])},${f(C[1])}A${r0},${r0} 0 ${lg} 0 ${f(D[0])},${f(D[1])}Z`; };
      let s = "";
      const SN = sun(W);
      s += `<circle cx="${c}" cy="${c}" r="64" fill="#fff"/>`;
      if (SN) { const sr = SN.sr * 15; let ss = SN.ss * 15; if (ss <= sr) ss += 360; s += `<path d="${seg(58, 64, sr, Math.min(ss, sr + 359.9))}" fill="#e9b13b"/>` + (ss < sr + 359.9 ? `<path d="${seg(58, 64, ss, sr + 360)}" fill="#2c3550"/>` : ""); }
      W.hourlyTempC.forEach((t, i) => { const a = hourOf(i) * 15; s += `<path d="${seg(112, 130, a + 0.5, a + 14.5)}" fill="${tc(t)}"/>`; if (i % 3 === 0) { const p = pt(142, a + 7.5); s += `<text x="${f(p[0])}" y="${f(p[1] + 3)}" text-anchor="middle" font-size="10" font-weight="700" fill="${tc(t, 60, 38)}">${t}°</text>`; } });
      W.rain24.forEach(r => { const a = r.hour * 15 + 15, len = pc(r.prob) * 0.38, A = pt(106, a), B = pt(106 - len, a); s += `<line class="rb" x1="${f(A[0])}" y1="${f(A[1])}" x2="${f(B[0])}" y2="${f(B[1])}" stroke="#3b6fd6" stroke-width="7" stroke-linecap="round" opacity="${0.35 + r.prob / 160}"/>`; if (r.prob >= 50) { const L = pt(106 - len - 9, a); s += `<text x="${f(L[0])}" y="${f(L[1] + 3)}" text-anchor="middle" font-size="8" fill="#3b6fd6" font-weight="700">${r.prob}%</text>`; } });
      [0, 6, 12, 18].forEach(h => { const p = pt(158, h * 15); s += `<text x="${f(p[0])}" y="${f(p[1] + 3)}" text-anchor="middle" font-size="9" fill="#7a7062">${hr(h)}</text>`; });
      const na = (H0 + (+W.minute || 0) / 60) * 15, HB = pt(66, na), H1 = pt(136, na), HL = pt(150, na);
      s += `<g class="hand"><line x1="${f(HB[0])}" y1="${f(HB[1])}" x2="${f(H1[0])}" y2="${f(H1[1])}" stroke="#2a2620" stroke-width="2"/><circle cx="${f(H1[0])}" cy="${f(H1[1])}" r="4" fill="#2a2620"/><text x="${f(HL[0])}" y="${f(HL[1])}" text-anchor="middle" font-size="9" font-weight="700" fill="#2a2620">now</text></g>`;
      s += `<text x="${c}" y="${c - 14}" text-anchor="middle" font-size="22">${W.now.icon}</text><text x="${c}" y="${c + 16}" text-anchor="middle" font-size="28" font-weight="700" fill="#2a2620">${W.now.tempC}°C</text><text x="${c}" y="${c + 32}" text-anchor="middle" font-size="9" fill="#7a7062">${W.now.desc}</text>`;
      return `<div class="d01"><div class="hd"><span class="pl">${W.place}</span><span class="sub">${W.date} · ${W.localTime}</span></div>
<div class="mid"><svg class="dial" viewBox="0 0 340 340" role="img" aria-label="24 hour forecast dial">${s}</svg>
<div class="side"><div style="font-size:15px;font-weight:600">${W.now.icon} ${W.now.desc}, ${W.now.tempC}°C</div><div class="sub">Feels like ${W.now.feelsC}°C</div>
<div class="lg"><i style="background:linear-gradient(90deg,${tc(LO)},${tc(HI)})"></i>ring: temperature by hour<br><i style="background:#3b6fd6"></i>spokes: chance of rain<br><i style="background:#e9b13b"></i>daylight ${W.details.sunrise}–${W.details.sunset}</div>
<div class="rs">🌧️ Next 24h: ${W.rainSummary}</div>
<dl>${det(W.details).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div></div>
<div class="wk">${W.days.map(d => `<div><b>${d.name}</b><span class="ic">${d.icon}</span><span class="ds">${d.desc}</span>${d.lo}° / <b style="display:inline">${d.hi}°</b><br><span class="p">💧 ${d.pop}%</span></div>`).join("")}</div></div>`;
    }
  });

  /* ---------------- 02 Tide table ---------------- */
  V.push({
    id: "02", name: "Tide Table", family: FAM, level: "medium",
    blurb: "Temperature drawn like a tide chart: a filled swell across 24 hours with HIGH and LOW callouts, rain hanging from the top like soundings, and the week set as a harbour-master's table. Inspired by meteogram and tide-chart apps.",
    pro: "Calm, nautical, and the high/low callouts are instantly useful.",
    con: "Dark navy theme; small chart labels at 380px width.",
    css: `.d02{background:#0c1a2b;color:#dfe8f2;font:13px/1.4 "Iowan Old Style","Palatino",Georgia,serif;padding:20px;box-sizing:border-box;width:100%}
.d02 .top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;border-bottom:1px solid #2a3d55;padding-bottom:10px}
.d02 .pl{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#7fb7d9;overflow-wrap:anywhere;min-width:0}
.d02 .t{font-size:54px;line-height:1;font-weight:400}.d02 .t small{font-size:20px;color:#7fb7d9}
.d02 .cd{text-align:right;font-size:14px}.d02 .cd span{color:#93a8bf;font-size:12px;display:block}
.d02 svg{width:100%;height:auto;display:block;margin:10px 0 2px}
.d02 .wave{stroke-dasharray:6 4;animation:d02-flow 6s linear infinite}
@keyframes d02-flow{to{stroke-dashoffset:-100}}
.d02 .rs{font-style:italic;color:#9fc3df;font-size:12px;margin-bottom:12px}
.d02 table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.d02 th{font-weight:400;color:#7fb7d9;text-align:left;font-size:10px;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid #2a3d55;padding:4px}
.d02 td{padding:5px 4px;border-bottom:1px dotted #22344a}
.d02 td.n{text-align:right}.d02 .hi{color:#ffb38a}.d02 .lo{color:#8cc7ff}
.d02 .ft{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;margin-top:12px;font-size:12px}
.d02 .ft span{color:#7fb7d9;font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:block}
${RM("02")}`,
    render: W => {
      setup(W);
      const T = W.hourlyTempC, n = T.length, X = i => 24 + i * (472 / ((n - 1) || 1));
      const tmin = Math.min(...T), tmax = Math.max(...T), tspan = Math.max(tmax - tmin, 4), toff = (tspan - (tmax - tmin)) / 2, mmx = maxMm(W);
      const Y = t => 165 - (t - tmin + toff) / tspan * 80;
      const pts = T.map((t, i) => [X(i), Y(t)]);
      const line = smooth(pts);
      let mx = 0, mn = 0; T.forEach((t, i) => { if (t > T[mx]) mx = i; if (t < T[mn]) mn = i; });
      const idxOf = h => ((h - H0 + 48) % 24);
      const SN = sun(W), sr = SN ? idxOf(SN.sr) : 0, ss = SN ? idxOf(SN.ss) : 0;
      let s = `<defs><linearGradient id="d02g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7c9" stop-opacity=".55"/><stop offset="1" stop-color="#3fa7c9" stop-opacity="0"/></linearGradient></defs>`;
      s += `<line x1="20" y1="18" x2="500" y2="18" stroke="#2a3d55"/>`;
      W.rain24.forEach((r, k) => { const x = X(k * 2) + 1, h = (+r.mm || 0) / mmx * 40; s += `<rect x="${f(x)}" y="18" width="${f(472 / 12 - 6)}" height="${f(Math.max(h, 1))}" fill="#6fa8ff" opacity="${0.3 + r.prob / 150}" rx="2"/><text x="${f(x + 16)}" y="${f(30 + h)}" text-anchor="middle" font-size="8.5" fill="#9fc3df">${pc(r.prob)}%</text>`; });
      s += `<text x="22" y="12" font-size="8.5" fill="#7fb7d9" letter-spacing="1">RAIN mm · CHANCE</text>`;
      (SN ? [[sr, "SUNRISE " + W.details.sunrise], [ss, "SUNSET " + W.details.sunset]] : []).forEach(([i, l]) => { const rt = X(i) > 380; s += `<line x1="${f(X(i))}" y1="70" x2="${f(X(i))}" y2="200" stroke="#e9c46a" stroke-dasharray="2 3"/><text x="${f(X(i) + (rt ? -3 : 3))}" y="78" ${rt ? 'text-anchor="end" ' : ""}font-size="8" fill="#e9c46a">${l}</text>`; });
      s += `<path d="${line} L${f(X(n - 1))},200 L${f(X(0))},200Z" fill="url(#d02g)"/><path class="wave" d="${line}" fill="none" stroke="#7fd3ee" stroke-width="2"/>`;
      s += `<circle cx="${f(X(mx))}" cy="${f(Y(T[mx]))}" r="3.5" fill="#ffb38a"/><text x="${f(X(mx))}" y="${f(Y(T[mx]) - 9)}" text-anchor="middle" font-size="10" fill="#ffb38a">HIGH ${T[mx]}° · ${hr(hourOf(mx))}</text>`;
      s += `<circle cx="${f(X(mn))}" cy="${f(Y(T[mn]))}" r="3.5" fill="#8cc7ff"/><text x="${f(X(mn))}" y="${f(Y(T[mn]) + 18)}" text-anchor="middle" font-size="10" fill="#8cc7ff">LOW ${T[mn]}° · ${hr(hourOf(mn))}</text>`;
      s += `<circle cx="${f(X(0))}" cy="${f(Y(T[0]))}" r="3.5" fill="#fff"/><text x="${f(X(0) + 6)}" y="${f(Y(T[0]) - 6)}" font-size="9" fill="#fff">now</text>`;
      for (let i = 0; i < n; i += 4) s += `<text x="${f(X(i))}" y="214" text-anchor="middle" font-size="9" fill="#93a8bf">${hr(hourOf(i))}</text>`;
      return `<div class="d02"><div class="top"><div><div class="pl">${W.place}</div><div class="t">${W.now.tempC}<small>°C</small></div></div>
<div class="cd">${W.now.icon} ${W.now.desc}<span>Feels like ${W.now.feelsC}°C · ${W.date}, ${W.localTime}</span></div></div>
<svg viewBox="0 0 520 220" role="img" aria-label="24 hour temperature and rain chart">${s}</svg>
<div class="rs">🌧️ ${W.rainSummary}</div>
<table><tr><th>Day</th><th>Conditions</th><th class="n">Low</th><th class="n">High</th><th class="n">Rain</th></tr>
${W.days.map(d => `<tr><td>${d.name}</td><td>${d.icon} ${d.desc}</td><td class="n lo">${d.lo}°</td><td class="n hi">${d.hi}°</td><td class="n">${d.pop}%</td></tr>`).join("")}</table>

  con: "Moon/sun maths in SVG; dome wastes the top corners.",
  css: `
.d25{background:linear-gradient(#0a0f22,#1b2244 60%,#141a33);color:#e8e6f5;font-family:"Futura","Century Gothic",system-ui,sans-serif;padding:18px 20px 20px;box-sizing:border-box}

.d25 svg{display:block;width:100%;height:auto;margin-top:4px}

@keyframes d25-tw{50%{opacity:.2}}
.d25-sum{font-size:13px;text-align:center;opacity:.9;margin:2px 0 12px}
.d25-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}

${RM(25)}`,
  render: W => {
    const n = W.now, d = W.details, cx = 260, hz = 210, R = 180, r = 150;
    const [rise, set] = sunSpan(W), now = nowMin(W);
    const day = now >= rise && now <= set;
    const f = Math.min(1, Math.max(0, day ? (now - rise) / ((set - rise) || 1) : ((now - set + 1440) % 1440) / ((1440 - set + rise) || 1)));

const WTH = (() => {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const COND = c => {
    if (c === 0) return ["☀️", "Sunny", "🌙", "Clear"];
    if (c === 1) return ["🌤️", "Mostly sunny", "🌙", "Mostly clear"];
    if (c === 2) return ["⛅", "Partly cloudy"];
    if (c === 3) return ["☁️", "Overcast"];
    if (c === 45 || c === 48) return ["🌫️", "Fog"];
    if (c >= 51 && c <= 55) return ["🌦️", "Drizzle"];
    if (c === 56 || c === 57) return ["🌧️", "Freezing drizzle"];
    if (c === 61) return ["🌧️", "Light rain"];
    if (c === 63) return ["🌧️", "Rain"];
    if (c === 65) return ["🌧️", "Heavy rain"];
    if (c === 66 || c === 67) return ["🌧️", "Freezing rain"];
    if (c === 71) return ["❄️", "Light snow"];
    if (c === 73) return ["❄️", "Snow"];
    if (c === 75 || c === 77) return ["❄️", "Heavy snow"];
    if (c === 80) return ["🌦️", "Light showers"];
    if (c === 81) return ["🌦️", "Showers"];
    if (c === 82) return ["⛈️", "Violent showers"];
    if (c === 85 || c === 86) return ["❄️", "Snow showers"];
    if (c === 95) return ["⛈️", "Thunderstorm"];
    if (c >= 96) return ["⛈️", "Thunderstorm with hail"];
    return ["🌡️", "Unknown"];
  };
  const cond = (c, night) => { const r = COND(c); return night && r[2] ? [r[2], r[3]] : [r[0], r[1]]; };
  const clock12 = (h, m) => `${((h + 11) % 12) + 1}${m === undefined ? "" : ":" + String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
  const compass = d => ["N","NE","E","SE","S","SW","W","NW"][Math.round(d / 45) % 8];
  const dayParts = iso => { const [y, m, d] = iso.slice(0, 10).split("-").map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); return { y, m: m - 1, d, wd: dt.getUTCDay() }; };
  const hm = iso => { const h = +iso.slice(11, 13), m = +iso.slice(14, 16); return { h, m, min: h * 60 + m, text: clock12(h, m) }; };

  function rainSummary(slots) {
    const total = slots.reduce((a, s) => a + s.mm, 0);
    const wet = slots.filter(s => s.prob >= 50 || s.mm >= 0.3);
    if (!wet.length) return slots.some(s => s.prob >= 30) ? "Small chance of showers, nothing heavy expected." : "No rain expected in the next 24 hours.";
    const peak = wet.reduce((a, s) => (s.mm > a.mm || (s.mm === a.mm && s.prob > a.prob)) ? s : a);
    const when = wet[0] === slots[0] ? "Rain now" : `Rain from about ${clock12(wet[0].hour)}`;
    return `${when}, heaviest around ${clock12(peak.hour)}, ${total.toFixed(1)} mm total.`;
  }

  // full=false asks Open-Meteo only for what the simple home page shows; full=true (gallery) asks for everything any design uses.
  async function load(full = true) {
    // Location comes from IP geolocation (ipwho.is: free, no key, CORS). wttr.in's plain-text location is
    // unavailable to browsers (it returns an HTML page for browser user agents) and its JSON "nearest_area"
    // is a finer locality (Vypeen instead of Kochi), so wttr.in is only the fallback.
    let city, country, lat, lon;
    try {
      const ir = await fetch("https://ipwho.is/");
      const ip = await ir.json();
      if (!ip.success || ip.latitude == null) throw new Error("ipwho.is failed");
      city = ip.city || ip.region; country = ip.country; lat = ip.latitude; lon = ip.longitude;
    } catch (e) {
      const wr = await fetch("https://wttr.in/?format=j1");
      if (!wr.ok) throw new Error("location lookup failed");
      const a = (await wr.json()).nearest_area[0];
      city = a.areaName[0].value; country = a.country[0].value; lat = a.latitude; lon = a.longitude;
    }
    const place = `${city}, ${country}`;
    const cur = ["temperature_2m", "apparent_temperature", "is_day", "weather_code", "relative_humidity_2m", "cloud_cover", "wind_speed_10m", "wind_direction_10m"];
    const day = ["weather_code", "temperature_2m_max", "temperature_2m_min", "precipitation_probability_max", "sunrise", "sunset", "uv_index_max"];
    const hr = ["temperature_2m", "precipitation_probability", "precipitation"];
    if (full) { cur.push("surface_pressure", "wind_gusts_10m", "dew_point_2m"); day.push("precipitation_sum"); hr.push("visibility"); }
    const q = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=" + cur + "&daily=" + day + "&hourly=" + hr + "&timezone=auto&forecast_days=7&forecast_hours=48";
    const mr = await fetch(q);
    if (!mr.ok) throw new Error("open-meteo " + mr.status);
    const m = await mr.json(), c = m.current, d = m.daily, h = m.hourly;
    const night = !c.is_day;
    const now = dayParts(c.time), t = hm(c.time);
    let start = h.time.findIndex(x => x >= c.time.slice(0, 13) + ":00"); if (start < 0) start = 0;
    const rain24 = [];
    for (let i = 0; i < 12; i++) {
      const ix = [start + i * 2, start + i * 2 + 1].filter(j => j < h.time.length);
      rain24.push({ hour: +h.time[ix[0]].slice(11, 13), prob: Math.max(0, ...ix.map(j => h.precipitation_probability[j] || 0)), mm: Math.round(ix.reduce((s, j) => s + (h.precipitation[j] || 0), 0) * 10) / 10 });
    }
    const [icon, desc] = cond(c.weather_code, night);
    const sr = hm(d.sunrise[0]), ss = hm(d.sunset[0]);
    const days = d.time.map((iso, i) => {
      const p = dayParts(iso), [ic, ds] = cond(d.weather_code[i], false);
      return { name: i === 0 ? "Today" : WD[p.wd].slice(0, 3), nameLong: i === 0 ? "Today" : WD[p.wd], dateNum: p.d, monthShort: MO[p.m].slice(0, 3),
        icon: ic, desc: ds, lo: Math.round(d.temperature_2m_min[i]), hi: Math.round(d.temperature_2m_max[i]),
        pop: d.precipitation_probability_max[i] || 0, mm: Math.round(((d.precipitation_sum && d.precipitation_sum[i]) || 0) * 10) / 10 };
    });
    const vis = h.visibility && h.visibility[start] != null ? Math.round(h.visibility[start] / 100) / 10 : 0;
    return {
      place: esc(place), cityName: esc(city), localTime: t.text, date: `${WD[now.wd]}, ${now.d} ${MO[now.m]}`, dateShort: `${now.d} ${MO[now.m].slice(0, 3)}`,
      weekdayLong: WD[now.wd], weekdayShort: WD[now.wd].slice(0, 3), dayNum: now.d, monthShort: MO[now.m].slice(0, 3), monthLong: MO[now.m], year: now.y,
      hour24: t.h, minute: t.m, isNight: night,
      now: { tempC: Math.round(c.temperature_2m), icon, desc, feelsC: Math.round(c.apparent_temperature), code: c.weather_code },
      rain24, rainSummary: rainSummary(rain24),
      hourlyTempC: h.temperature_2m.slice(start, start + 24).map(Math.round),
      days,
      details: { humidity: Math.round(c.relative_humidity_2m), windKmh: Math.round(c.wind_speed_10m), windDir: compass(c.wind_direction_10m), gustKmh: Math.round(c.wind_gusts_10m || 0),
        uv: Math.round(d.uv_index_max[0]), cloud: Math.round(c.cloud_cover), sunrise: sr.text, sunset: ss.text, sunriseMin: sr.min, sunsetMin: ss.min,
        visibilityKm: vis, pressureHpa: Math.round(c.surface_pressure || 0), dewC: Math.round(c.dew_point_2m || 0) }
    };
  }
  // copy the design's own background onto the page so it fills the window
  function paintBody(rootEl) {
    if (!rootEl) return;
    const cs = getComputedStyle(rootEl);
    document.body.style.background = cs.backgroundImage !== "none" ? cs.backgroundImage : cs.backgroundColor;
    document.body.style.backgroundAttachment = "fixed";
  }
  return { load, paintBody, esc };
})();

const vs = window.V.slice().sort((a, b) => a.id.localeCompare(b.id));
const slug = v => v.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

let W = null, fLevel = "all", fFam = "all";
const fams = [...new Set(vs.map(v => v.family))];
const safe = (v, w) => { try { return v.render(w); } catch (e) { return '<div class="wth-msg">render error</div>'; } };
function drawBar() {
  const b = (t, k, val) => `<button data-k="${k}" data-v="${val}" class="${(k === "l" ? fLevel : fFam) === val ? "on" : ""}">${t}</button>`;
  document.getElementById("bar").innerHTML = "Complexity: " + ["all","simple","medium","rich"].map(x => b(x, "l", x)).join("") + " &nbsp; Style: " + b("all", "f", "all") + fams.map(x => b(x, "f", x)).join("");
}
function drawGrid() {
  const g = document.getElementById("grid");
  g.innerHTML = vs.filter(v => (fLevel === "all" || v.level === fLevel) && (fFam === "all" || v.family === fFam)).map(v =>
    `<a class="card" href="#${slug(v)}"><h2>${v.name} <span>${v.level}</span></h2><div class="thumb"><div>${safe(v, W)}</div></div><p>${v.blurb.split(". ")[0].replace(/\.$/, "")}.</p></a>`).join("");
  g.querySelectorAll(".thumb").forEach(t => { const s = t.clientWidth / 560; t.firstElementChild.style.transform = "scale(" + s + ")"; });
}
document.getElementById("bar").onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.k === "l") fLevel = b.dataset.v; else fFam = b.dataset.v; drawBar(); drawGrid(); };
addEventListener("resize", () => { if (W && !location.hash.slice(1)) drawGrid(); });
function route() {
  const key = decodeURIComponent(location.hash.slice(1));
  const v = key && vs.find(x => slug(x) === key || x.id === key);
  const list = document.getElementById("list"), full = document.getElementById("full");
  if (!W) return;
  if (v) {
    list.style.display = "none"; full.style.display = "block";
    document.getElementById("fname").textContent = v.name;
    document.title = v.name + " · weather";
    const st = document.getElementById("fstage"); st.innerHTML = safe(v, W);
    WTH.paintBody(st.firstElementChild); scrollTo(0, 0);
  } else {
    full.style.display = "none"; list.style.display = "block";
    document.body.style.background = ""; document.title = "Weather, in many designs";
    drawBar(); drawGrid();
  }
}
addEventListener("hashchange", route);
WTH.load().then(w => { W = w; route(); }).catch(e => { document.getElementById("grid").innerHTML = '<div class="wth-msg">Couldn\'t load weather (' + WTH.esc(e.message) + ').</div>'; });
</script></body></html>

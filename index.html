<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>Weather</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}html,body{margin:0}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:16px 0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{width:100%;max-width:560px}
.msg{padding:60px 20px;text-align:center;color:var(--mu)}
/* the weather view */
:root{--bg:#ffffff;--fg:#14161a;--mu:#6b7280;--bl:#1f5fd1;--ln:#f0f1f3;--ln2:#eceef1}
.wx{background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,"Inter","Segoe UI",sans-serif;padding:20px 22px;box-sizing:border-box;width:100%}
.wx .hd{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:6px 0 4px}
.wx .t{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.wx .pl{font-weight:700;font-size:17px;overflow-wrap:anywhere;min-width:0}.wx .mu{color:var(--mu);font-size:12px}.wx .ds{font-size:14px}
.wx .sv{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
.wx svg{width:100%;min-width:460px;height:auto;display:block}
.wx .rs{font-size:13px;color:var(--bl);margin:4px 0 14px;text-align:center}
.wx .sh{display:none;text-align:center;font-size:11px;color:var(--mu);margin-top:2px}
.wx .row{display:grid;grid-template-columns:42px 126px minmax(0,1fr) 48px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--ln);font-size:12.5px}
.wx .tr{position:relative;height:22px;margin:0 22px}
.wx .tr i{position:absolute;top:8px;height:6px;border-radius:3px}
.wx .tr em{position:absolute;top:2px;font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.wx .tr .l{color:var(--mu);transform:translateX(-100%);padding-right:5px}.wx .tr .h{font-weight:700;padding-left:5px}
.wx .p{display:flex;align-items:center;gap:4px;color:var(--bl);font-weight:600;font-size:11.5px;justify-content:flex-end}
.wx .dt{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--ln2);border:1px solid var(--ln2);border-radius:10px;overflow:hidden;margin-top:14px;text-align:center}
.wx .dt div{padding:9px 4px;font-weight:600;background:var(--bg)}
.wx .dt span{display:block;font-size:10px;font-weight:400;color:var(--mu)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e8ecf2;--mu:#98a2b3;--bl:#6ea8ff;--ln:#1c232c;--ln2:#232b36}}
@media (max-width:520px){.wx{padding:16px 14px}.wx .sh{display:block}.wx .t{font-size:60px}.wx .dt{grid-template-columns:repeat(3,1fr)}.wx .row{grid-template-columns:44px 1fr auto;grid-template-areas:"dn dc p" "tr tr tr";row-gap:2px;padding:7px 0}.wx .row .dn{grid-area:dn}.wx .row .dc{grid-area:dc}.wx .row .tr{grid-area:tr}.wx .row .p{grid-area:p}}

</style></head>
<body><main id="app"><div class="msg">Loading weather…</div></main>
<script>
// ---- helpers for the chart ----
const f = n => (+n).toFixed(1);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pc = v => clamp(+v || 0, 0, 100);
const hrs = h => (h === 0 ? "12a" : h === 12 ? "12p" : h < 12 ? h + "a" : h - 12 + "p");
const smooth = p => {
  let d = `M${f(p[0][0])},${f(p[0][1])}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d;
};
// temperature -> colour, scaled to the week's own min/max
let LO = 20, HI = 32;
const setup = W => {
  const v = [...W.hourlyTempC, ...W.days.flatMap(d => [d.lo, d.hi]), W.now.tempC].filter(Number.isFinite);
  let a = Math.min(...v), b = Math.max(...v);
  if (b - a < 6) { const m = (a + b) / 2; a = m - 3; b = m + 3; }
  LO = a; HI = b;
};
const tc = (t, s = 70, l = 55) => `hsl(${Math.round(220 - clamp((t - LO) / (HI - LO || 1), 0, 1) * 205)},${s}%,${l}%)`;
const det = d => [
  ["Humidity", d.humidity + "%"], ["Wind", `${d.windKmh} km/h ${d.windDir}`], ["UV index", d.uv],
  ["Cloud cover", d.cloud + "%"], ["Sunrise", d.sunrise], ["Sunset", d.sunset]
];

// ---- the view ----
const render = W => {
      setup(W);
      const T = W.hourlyTempC, n = T.length, X = i => 16 + i * (488 / ((n - 1) || 1));
      const tmin = Math.min(...T), tmax = Math.max(...T), tspan = Math.max(tmax - tmin, 4), toff = (tspan - (tmax - tmin)) / 2, Y = t => 100 - (t - tmin + toff) / tspan * 64;
      let s = `<path d="${smooth(T.map((t, i) => [X(i), Y(t)]))}" fill="none" stroke="currentColor" stroke-width="2"/>`;
      T.forEach((t, i) => { if (i % 2 === 0) s += `<circle cx="${f(X(i))}" cy="${f(Y(t))}" r="2.5" fill="${i ? "currentColor" : "#e4572e"}"/><text x="${f(X(i))}" y="${f(Y(t) - 8)}" text-anchor="middle" font-size="10" font-weight="600" fill="currentColor">${t}°</text>`; });
      W.rain24.forEach((r, k) => { const x = X(k * 2), h = pc(r.prob) * 0.32; s += `<rect x="${f(x - 7)}" y="${f(146 - h)}" width="14" height="${f(h)}" rx="2" style="fill:var(--bl)" opacity="${0.25 + pc(r.prob) / 140}"/>${r.prob >= 30 ? `<text x="${f(x)}" y="${f(142 - h)}" text-anchor="middle" font-size="8.5" style="fill:var(--bl)">${pc(r.prob)}%</text>` : ""}<text x="${f(x)}" y="160" text-anchor="middle" font-size="9" style="fill:var(--mu)">${k === 0 ? "now" : hrs(r.hour)}</text>`; });
      s += `<line x1="8" y1="146" x2="512" y2="146" style="stroke:var(--ln2)"/>`;
      const all = W.days.flatMap(d => [d.lo, d.hi]), gl = Math.min(...all) - 1, gh = Math.max(...all) + 1, P = t => ((t - gl) / (gh - gl) * 100).toFixed(1);
      return `<div class="wx"><div class="hd"><div class="pl">${W.place}</div><div class="t">${W.now.tempC}°C</div><div class="ds">${W.now.icon} ${W.now.desc} · feels like ${W.now.feelsC}°C</div><div class="mu">${W.date}, ${W.localTime}</div></div>
<div class="sv"><svg viewBox="0 0 520 164" role="img" aria-label="Next 24 hours temperature and rain chance">${s}</svg></div>
<div class="sh">swipe the chart for later hours →</div>
<div class="rs">🌧️ ${W.rainSummary}</div>
${W.days.map(d => `<div class="row"><b class="dn">${d.name}</b><span class="dc">${d.icon} ${d.desc}</span><span class="tr"><i style="left:${P(d.lo)}%;width:${(P(d.hi) - P(d.lo)).toFixed(1)}%;background:linear-gradient(90deg,${tc(d.lo)},${tc(d.hi)})"></i><em class="l" style="left:${P(d.lo)}%">${d.lo}°</em><em class="h" style="left:${P(d.hi)}%">${d.hi}°</em></span><span class="p">💧 ${d.pop}%</span></div>`).join("")}
<div class="dt">${det(W.details).map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join("")}</div></div>`;
};

// ---- data: location from IP (ipwho.is, wttr.in as fallback), forecast from Open-Meteo ----
// Open-Meteo is asked only for what this page shows.
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MO = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const clock12 = (h, m) => `${((h + 11) % 12) + 1}${m === undefined ? "" : ":" + String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
const compass = d => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(d / 45) % 8];
const hm = iso => { const h = +iso.slice(11, 13), m = +iso.slice(14, 16); return { h, text: clock12(h, m) }; };
const dayOf = iso => { const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return { d, m: m - 1, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; };

// WMO weather code -> [emoji, text]; clear/mostly clear get a moon at night
function cond(c, night) {
  if (c === 0) return night ? ["🌙", "Clear"] : ["☀️", "Sunny"];
  if (c === 1) return night ? ["🌙", "Mostly clear"] : ["🌤️", "Mostly sunny"];
  if (c === 2) return ["⛅", "Partly cloudy"];
  if (c === 3) return ["☁️", "Overcast"];
  if (c === 45 || c === 48) return ["🌫️", "Fog"];
  if (c >= 51 && c <= 55) return ["🌦️", "Drizzle"];
  if (c === 56 || c === 57) return ["🌧️", "Freezing drizzle"];
  if (c === 61) return ["🌧️", "Light rain"];
  if (c === 63) return ["🌧️", "Rain"];
  if (c === 65) return ["🌧️", "Heavy rain"];
  if (c === 66 || c === 67) return ["🌧️", "Freezing rain"];
  if (c === 71) return ["❄️", "Light snow"];
  if (c === 73) return ["❄️", "Snow"];
  if (c === 75 || c === 77) return ["❄️", "Heavy snow"];
  if (c === 80) return ["🌦️", "Light showers"];
  if (c === 81) return ["🌦️", "Showers"];
  if (c === 82) return ["⛈️", "Violent showers"];
  if (c === 85 || c === 86) return ["❄️", "Snow showers"];
  if (c === 95) return ["⛈️", "Thunderstorm"];
  if (c >= 96) return ["⛈️", "Thunderstorm with hail"];
  return ["🌡️", "Unknown"];
}

function rainSummary(slots) {
  const total = slots.reduce((a, s) => a + s.mm, 0);
  const wet = slots.filter(s => s.prob >= 50 || s.mm >= 0.3);
  if (!wet.length) return slots.some(s => s.prob >= 30) ? "Small chance of showers, nothing heavy expected." : "No rain expected in the next 24 hours.";
  const peak = wet.reduce((a, s) => (s.mm > a.mm || (s.mm === a.mm && s.prob > a.prob)) ? s : a);
  const when = wet[0] === slots[0] ? "Rain now" : `Rain from about ${clock12(wet[0].hour)}`;
  return `${when}, heaviest around ${clock12(peak.hour)}, ${total.toFixed(1)} mm total.`;
}

async function locate() {
  try {
    const ip = await (await fetch("https://ipwho.is/")).json();
    if (!ip.success || ip.latitude == null) throw new Error("ipwho.is failed");
    return { city: ip.city || ip.region, country: ip.country, lat: ip.latitude, lon: ip.longitude };
  } catch (e) {
    // wttr.in's plain-text location isn't available to browsers, and its JSON gives a finer locality than the city
    const r = await fetch("https://wttr.in/?format=j1");
    if (!r.ok) throw new Error("location lookup failed");
    const a = (await r.json()).nearest_area[0];
    return { city: a.areaName[0].value, country: a.country[0].value, lat: a.latitude, lon: a.longitude };
  }
}

async function loadWeather() {
  const loc = await locate();
  const q = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon +
    "&current=temperature_2m,apparent_temperature,is_day,weather_code,relative_humidity_2m,cloud_cover,wind_speed_10m,wind_direction_10m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max" +
    "&hourly=temperature_2m,precipitation_probability,precipitation&timezone=auto&forecast_days=7&forecast_hours=48";
  const r = await fetch(q);
  if (!r.ok) throw new Error("open-meteo " + r.status);
  const m = await r.json(), c = m.current, d = m.daily, h = m.hourly;
  const now = dayOf(c.time), t = hm(c.time);
  let start = h.time.findIndex(x => x >= c.time.slice(0, 13) + ":00"); if (start < 0) start = 0;
  const rain24 = [];
  for (let i = 0; i < 12; i++) { // 2-hour slots for the next 24 hours
    const ix = [start + i * 2, start + i * 2 + 1].filter(j => j < h.time.length);
    rain24.push({ hour: +h.time[ix[0]].slice(11, 13), prob: Math.max(0, ...ix.map(j => h.precipitation_probability[j] || 0)), mm: Math.round(ix.reduce((s, j) => s + (h.precipitation[j] || 0), 0) * 10) / 10 });
  }
  const [icon, desc] = cond(c.weather_code, !c.is_day);
  return {
    place: esc(`${loc.city}, ${loc.country}`), localTime: t.text, date: `${WD[now.wd]}, ${now.d} ${MO[now.m]}`,
    now: { tempC: Math.round(c.temperature_2m), icon, desc, feelsC: Math.round(c.apparent_temperature) },
    rain24, rainSummary: rainSummary(rain24),
    hourlyTempC: h.temperature_2m.slice(start, start + 24).map(Math.round),
    days: d.time.map((iso, i) => { const p = dayOf(iso), [ic, ds] = cond(d.weather_code[i], false);
      return { name: i === 0 ? "Today" : WD[p.wd].slice(0, 3), icon: ic, desc: ds, lo: Math.round(d.temperature_2m_min[i]), hi: Math.round(d.temperature_2m_max[i]), pop: d.precipitation_probability_max[i] || 0 }; }),
    details: { humidity: Math.round(c.relative_humidity_2m), windKmh: Math.round(c.wind_speed_10m), windDir: compass(c.wind_direction_10m), uv: Math.round(d.uv_index_max[0]),
      cloud: Math.round(c.cloud_cover), sunrise: hm(d.sunrise[0]).text, sunset: hm(d.sunset[0]).text }
  };
}

loadWeather().then(W => { document.getElementById("app").innerHTML = render(W); })
  .catch(e => { document.getElementById("app").innerHTML = '<div class="msg">Couldn\'t load weather (' + esc(e.message) + ').</div>'; });
</script></body></html>
